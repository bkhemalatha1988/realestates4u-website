function xy(nx,ny){const k=111320,c=Math.cos(G.lat*Math.PI/180),h=G.w*ASPECT,r=G.rot*Math.PI/180,X=(nx-.5)*G.w,Y=(.5-ny)*h,
 x=X*Math.cos(r)+Y*Math.sin(r),y=-X*Math.sin(r)+Y*Math.cos(r);return [G.lng+x/(k*c),G.lat+y/k]}
function geo(){const F=[],L=[];PLOTS.forEach(p=>{const ring=p.p.map(q=>xy(q[0],q[1]));ring.push(ring[0]);
 F.push({type:'Feature',id:p.id,properties:{id:p.id,color:COL[p.st],hc:HC[p.st]},geometry:{type:'Polygon',coordinates:[ring]}});
 const cx=p.p.reduce((a,q)=>a+q[0],0)/p.p.length,cy=p.p.reduce((a,q)=>a+q[1],0)/p.p.length;
 L.push({type:'Feature',properties:{t:(p.n?String(p.n):'')+(p.s?'\n'+p.s:'')},geometry:{type:'Point',coordinates:xy(cx,cy)}})});
 return [{type:'FeatureCollection',features:F},{type:'FeatureCollection',features:L}]}

const lbl=s=>s=='unset'?'Not set':s[0].toUpperCase()+s.slice(1);

function parse(t){const s=new Set();t.split(',').forEach(x=>{const m=x.trim().match(/^(\d+)\s*-\s*(\d+)$/);if(m){for(let i=+m[1];i<=+m[2];i++)s.add(i)}else if(/^\d+$/.test(x.trim()))s.add(+x.trim())});return s}
ap.onclick=()=>{const s=parse(rng.value);PLOTS.forEach(p=>{if(p.n&&s.has(p.n))p.st=sel.value});save();refresh()};
