<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>realestates4u – Map</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:system-ui,sans-serif}
#map{position:absolute;inset:0}
#top{position:absolute;z-index:1000;top:10px;left:10px;right:10px;background:#f5f1e6;border-radius:24px;padding:10px 16px;font-weight:700;color:#1b5e20;display:flex;justify-content:space-between;align-items:center;box-shadow:0 2px 8px #0004}
#top a{color:#1b5e20;font-size:13px;text-decoration:none}
#card,#sheet{position:absolute;z-index:1000;left:10px;right:10px;background:#0f2e22;color:#fff;border-radius:18px;padding:14px;display:none;box-shadow:0 4px 16px #0006}
#card{bottom:12px}
#card h3,#sheet h2{margin:0 0 4px}#card small,#sheet small{color:#9fc4b0}
.chips{margin:8px 0;display:flex;gap:6px;flex-wrap:wrap}.chips span{background:#1f4a39;border-radius:8px;padding:4px 8px;font-size:12px}
.btn{display:block;width:100%;text-align:center;background:#fff;color:#0f2e22;border:0;border-radius:20px;padding:10px;font-weight:700;margin-top:8px;text-decoration:none;font-size:14px}
.btn.g{background:#25d366;color:#fff}
.x{position:absolute;right:12px;top:10px;background:#ffffff22;border:0;color:#fff;width:28px;height:28px;border-radius:14px;font-size:16px}
#sheet{top:70px;bottom:12px;overflow:auto}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
.grid div{background:#1f4a39;border-radius:12px;padding:10px;text-align:center}.grid b{display:block;font-size:18px}.grid small{font-size:11px}
.tabs{display:flex;gap:6px;margin:10px 0}.tabs button{flex:1;padding:8px;border:0;border-radius:16px;background:#1f4a39;color:#fff}.tabs button.on{background:#fff;color:#0f2e22;font-weight:700}
#tabbody{font-size:14px;line-height:1.6}
#edit{position:absolute;z-index:1100;top:62px;left:10px;right:10px;background:#fffffff0;border-radius:12px;padding:10px;font-size:12px;display:none}
#edit label{display:block;margin:4px 0}#edit input[type=range]{width:100%}
#edit .row{display:flex;gap:4px;margin:4px 0}#edit button{flex:1;padding:8px}
#edit textarea{width:100%;height:60px;font-size:11px}
.leaflet-container{background:#222}
.pin{position:absolute;display:flex;align-items:center;white-space:nowrap;cursor:pointer;left:-12px;top:-34px}
.pin.l{left:auto;right:-12px;flex-direction:row-reverse}.pin.l span{margin-left:0;margin-right:4px}.pin span{margin-left:4px;background:#fff;color:#0f2e22;font:700 12px system-ui,sans-serif;padding:3px 8px;border-radius:10px;box-shadow:0 1px 4px #0006}
#srch{position:absolute;z-index:1100;top:62px;left:10px;width:min(290px,calc(100% - 20px))}
#sq{width:100%;padding:11px 16px;border:0;border-radius:22px;font-size:15px;background:#fff;box-shadow:0 2px 10px #0005;outline:none}
#sres{display:none;margin-top:6px;background:#fff;border-radius:14px;box-shadow:0 4px 14px #0005;max-height:260px;overflow:auto}
.ri{padding:10px 14px;border-bottom:1px solid #eee;cursor:pointer;display:grid;grid-template-columns:14px 1fr;column-gap:8px;align-items:center}
.ri i{width:12px;height:12px;border-radius:50%;grid-row:span 2}.ri b{font-size:14px;color:#0f2e22}.ri small{color:#666;font-size:12px}
.ri.none{display:block;color:#777}.ri:hover{background:#f3f7f4}
</style></head><body>
<div id="map"></div>
<div id="top"><span>realestates4u · Map</span><a href="index.html">← Home</a></div>
<div id="srch"><input id="sq" type="search" placeholder="Search venture name..." autocomplete="off"><div id="sres"></div></div>
<div id="edit">
 <b id="etitle"></b>
 <label>Size (meters wide) <input type="range" id="ew" min="150" max="900"></label>
 <label>Rotation (°) <input type="range" id="er" min="-180" max="180" step="0.5"></label>
 <label>Layout opacity <input type="range" id="eo" min="0.2" max="1" step="0.05" value="0.85"></label>
 <div class="row"><button data-d="n">↑</button><button data-d="s">↓</button><button data-d="w">←</button><button data-d="e">→</button><button id="ecopy">Copy values</button><button id="eall">Copy all</button></div>
 <textarea id="eout" readonly></textarea>
 <div>Tap on map = coordinates: <b id="clk">-</b></div>
</div>
<div id="card"><button class="x" onclick="closeAll()">✕</button><h3 id="cn"></h3><small id="cl"></small><div class="chips" id="cc"></div><button class="btn" onclick="openSheet()">View details ↗</button></div>
<div id="sheet"><button class="x" onclick="closeSheet()">✕</button><h2 id="sn"></h2><small id="sl"></small><div class="chips" id="sc"></div>
 <div class="grid" id="sg"></div>
 <div class="tabs"><button class="on" data-t="about">About</button><button data-t="appr">Approvals</button><button data-t="loc">Location</button></div>
 <div id="tabbody"></div>
 <a class="btn g" id="wa" target="_blank">WhatsApp</a><a class="btn" href="tel:9949610063">Call 9949610063</a></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet-imageoverlay-rotated@0.1.1/Leaflet.ImageOverlay.Rotated.js"></script>
<script>
// ===== EDIT THIS DATA (lat/lng are PLACEHOLDERS - replace with real values) =====
const V=[
 {id:'seven-hills',dy:12,name:'Seven Hills Future City',loc:'Thakkellapally, Yacharam · Sagar Highway',lat:16.986845,lng:78.697217,
  acres:'20.7',plots:273,sizes:'147–484 sq yd',price:13000,dev:'Sri Mahika',img:'images/layout-seven-hills.png',w:475,rot:0,
  appr:'DTCP approved · T.L.P. 73/2023/H & 82/2023/HRO/H1 · TG RERA P02400007571 · 50% bank loan available',
  about:'DTCP approved layout with 40\' and 33\' wide roads, 10% open space and parks, near Bharat Future City.'},
 {id:'gold-space',lab:'l',name:'Gold Space',loc:'Kadthal · Srisailam Highway',lat:16.962729,lng:78.507847,
  acres:'24.5',plots:'250+',sizes:'176–1171 sq yd',price:19999,dev:'NRI Projects',img:'images/layout-gold-space.png',w:497,rot:-1,
  appr:'DTCP approved · LP No. 211/2023/H · TG RERA · Bank loans available',
  about:'200 feet Srisailam highway facing project, 40\' and 33\' blacktop roads, park and children\'s play area, avenue plantation, compound wall.'}
,{id:'artha-sagar',dy:-14,name:'Artha Sagar',loc:'Yacharam · Sagar Highway',lat:16.99695,lng:78.69744,
  acres:'11',plots:165,sizes:'150 sq yd',price:null,dev:'NRI Projects',img:'images/layout-artha-sagar.png',w:468,rot:-61.5,
  appr:'DTCP approved · LP No. 26/2021/H',
  about:'200 ft Sagar highway facing villa plots with 40\' and 33\' black top roads, entrance arch, landscaped parks, avenue plantation, underground sewage and compound wall.'}
,{id:'brundavan-homes',lab:'l',name:'NRI Brundavan Homes',loc:'Gungal · Ibrahimpatnam · Sagar Highway',lat:17.116904,lng:78.673148,
  acres:'29',plots:'450+',sizes:'146+ sq yd',price:null,dev:'NRI Projects',img:'images/layout-brundavan-homes.png',w:479,rot:19.5,
  appr:'HMDA final approved layout · TG RERA · Bank loans available',
  about:'200 ft Sagar highway facing villa plots, 5 min from Bongloor junction (ORR Exit 12), 40, 33 and 30 ft CC roads, entrance arch, park and children\'s play area, avenue plantation and compound wall.'}
,{id:'temple-city-grand',name:'Temple City Grand',loc:'Alair · Near Yadadri Temple · Warangal Highway',lat:17.604366,lng:79.057967,
  acres:'50',plots:'300+',sizes:'Various',price:6500,dev:'NRI Projects',img:'images/layout-temple-city-grand.png',w:443,rot:7,
  appr:'DTCP approved · LP No. 203/2020/H',
  about:'Near Yadadri temple on the 200 ft Warangal highway, with 60, 40 and 30 ft black top roads, entrance arch with security, overhead water tank, children\'s play area, landscaped park, avenue plantation, STP and underground drainage.'}
];
// ================================================================================
const q=new URLSearchParams(location.search),EDIT=q.has('edit'),EMBED=q.has('embed');
let saved={};try{saved=JSON.parse(localStorage.getItem('re4u_edits')||'{}')}catch(e){}
if(EDIT)V.forEach(v=>{const x=saved[v.id];if(x)Object.assign(v,x)});
function saveEdit(v){if(!EDIT)return;saved[v.id]={lat:+v.lat.toFixed(6),lng:+v.lng.toFixed(6),w:Math.round(v.w),rot:v.rot};try{localStorage.setItem('re4u_edits',JSON.stringify(saved))}catch(e){}}
const map=L.map('map',{zoomControl:false,center:[17.0,78.6],zoom:9});
L.control.zoom({position:'bottomright'}).addTo(map);
const esri=L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{maxNativeZoom:18,maxZoom:20,attribution:'Esri World Imagery'});
const clarity=L.tileLayer('https://clarity.maptiles.arcgis.com/arcgis/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{maxNativeZoom:18,maxZoom:20,attribution:'Esri Clarity'});
const osm=L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'OpenStreetMap'});
esri.addTo(map);L.control.layers({'Satellite (Esri)':esri,'Satellite (Clarity)':clarity,'Street map':osm},null,{position:'bottomleft'}).addTo(map);
const col=p=>{if(!p)return '#9e9e9e';const t=Math.min(1,Math.max(0,(p-8000)/(25000-8000)));return `hsl(${120-120*t},85%,48%)`};
let cur=null,ov=null,mk={};
function fitAll(){map.fitBounds(L.latLngBounds(V.map(v=>[v.lat,v.lng])),{padding:[40,40],maxZoom:12})}
function ovBounds(v){const c=corners(v);return L.latLngBounds([c[0],c[1],c[2],L.latLng(c[1].lat+c[2].lat-c[0].lat,c[1].lng+c[2].lng-c[0].lng)])}
const corners=(v)=>{const k=111320,c=Math.cos(v.lat*Math.PI/180),h=v.w*v.ar,r=v.rot*Math.PI/180,
 p=(x,y)=>{const X=x*Math.cos(r)+y*Math.sin(r),Y=-x*Math.sin(r)+y*Math.cos(r);return L.latLng(v.lat+Y/k,v.lng+X/(k*c))};
 return [p(-v.w/2,h/2),p(v.w/2,h/2),p(-v.w/2,-h/2)]};
V.forEach(v=>{
 const im=new Image();im.src=v.img;im.onload=()=>{v.ar=im.naturalHeight/im.naturalWidth};v.ar=0.6;
mk[v.id]=L.marker([v.lat,v.lng],{icon:L.divIcon({className:'',iconSize:[0,0],html:`<div class="pin${v.lab==='l'?' l':''}"><svg width="24" height="34" viewBox="0 0 24 34" style="filter:drop-shadow(0 1px 2px #0008)"><path d="M12 0C5.4 0 0 5.4 0 12c0 9 12 22 12 22s12-13 12-22C24 5.4 18.6 0 12 0z" fill="${col(v.price)}" stroke="#fff" stroke-width="1.5"/><circle cx="12" cy="12" r="4.5" fill="#fff"/></svg><span style="position:relative;top:${v.dy||0}px">${v.name}</span></div>`})}).addTo(map).on('click',()=>pick(v));
});
fitAll();
function lab(){document.getElementById('map').classList.toggle('nolab',map.getZoom()<11)}
map.on('zoomend',lab);lab();
if(EMBED){document.getElementById('top').style.display='none';document.getElementById('sheet').style.top='12px';if('ontouchstart' in window)map.dragging.disable()}
function showOv(v){
 if(ov)map.removeLayer(ov);
 const c=corners(v);ov=L.imageOverlay.rotated(v.img,c[0],c[1],c[2],{opacity:+(document.getElementById('eo').value||0.85)}).addTo(map);
}
function pick(v){
 cur=v;closeSheet();
 showOv(v);
 map.flyToBounds(ovBounds(v),{paddingTopLeft:[8,EDIT?300:EMBED?20:70],paddingBottomRight:[8,EMBED?150:190],maxZoom:19,duration:1});
 cn.textContent=v.name;cl.textContent='📍 '+v.loc;
 cc.innerHTML=`<span>${v.price?'₹'+v.price.toLocaleString('en-IN')+' / sq yd':'Price on request'}</span><span>${v.sizes}</span>`;
 card.style.display='block';
 if(EDIT){edit.style.display='block';etitle.textContent=v.name;ew.value=v.w;er.value=v.rot;dump()}
}
function openSheet(){const v=cur;card.style.display='none';sheet.style.display='block';
 sn.textContent=v.name;sl.textContent='📍 '+v.loc;sc.innerHTML='<span>DTCP</span><span>Developer: '+v.dev+'</span>';
 sg.innerHTML=`<div><b>${v.acres}</b><small>acres</small></div><div><b>${v.sizes.replace(' sq yd','')}</b><small>sq yd plots</small></div><div><b>${v.plots}</b><small>plots</small></div>`;
 tab('about');wa.href='https://wa.me/919949610063?text='+encodeURIComponent('Hi, I am interested in '+v.name)}
function tab(t){document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('on',b.dataset.t===t));
 tabbody.innerHTML={about:cur.about,appr:cur.appr,loc:cur.loc+'<br><a style="color:#9fc4b0" target="_blank" href="https://www.google.com/maps?q='+cur.lat+','+cur.lng+'">Open in Google Maps</a>'}[t]}
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>tab(b.dataset.t));
function closeSheet(){sheet.style.display='none';if(cur)card.style.display='block'}
function closeAll(){card.style.display='none';sheet.style.display='none';edit.style.display='none';if(ov){map.removeLayer(ov);ov=null}cur=null;sq.value='';fitAll()}
// edit tool (open map.html?edit=1)
function dump(){saveEdit(cur);eout.value=`lat:${cur.lat.toFixed(6)}, lng:${cur.lng.toFixed(6)}, w:${Math.round(cur.w)}, rot:${cur.rot}`}
ew.oninput=()=>{cur.w=+ew.value;showOv(cur);dump()};er.oninput=()=>{cur.rot=+er.value;showOv(cur);dump()};eo.oninput=()=>ov&&ov.setOpacity(+eo.value);
document.querySelectorAll('#edit [data-d]').forEach(b=>b.onclick=()=>{const s=0.00004*Math.max(1,cur.w/200),d=b.dataset.d;
 if(d=='n')cur.lat+=s;if(d=='s')cur.lat-=s;if(d=='e')cur.lng+=s;if(d=='w')cur.lng-=s;mk[cur.id].setLatLng([cur.lat,cur.lng]);showOv(cur);dump()});
eall.onclick=()=>{const t=V.map(v=>`${v.id}: lat:${v.lat.toFixed(6)}, lng:${v.lng.toFixed(6)}, w:${Math.round(v.w)}, rot:${v.rot}`).join('\n');eout.value=t;navigator.clipboard&&navigator.clipboard.writeText(t);eall.textContent='Copied ✓'};
ecopy.onclick=()=>{navigator.clipboard&&navigator.clipboard.writeText(eout.value);ecopy.textContent='Copied ✓'};
map.on('click',e=>{if(EDIT)clk.textContent=e.latlng.lat.toFixed(6)+', '+e.latlng.lng.toFixed(6)});
const sq=document.getElementById('sq'),sres=document.getElementById('sres'),srch=document.getElementById('srch');
if(EMBED){srch.style.top='10px';srch.style.width='min(290px,calc(100% - 170px))'}
if(EDIT)srch.style.display='none';
L.DomEvent.disableClickPropagation(srch);L.DomEvent.disableScrollPropagation(srch);
const match=t=>V.filter(v=>!t||(v.name+' '+v.loc).toLowerCase().includes(t));
function drawRes(){const r=match(sq.value.trim().toLowerCase());
 sres.innerHTML=r.length?r.map(v=>`<div class="ri" data-id="${v.id}"><i style="background:${col(v.price)}"></i><b>${v.name}</b><small>${v.loc}</small></div>`).join(''):'<div class="ri none">No venture found</div>';sres.style.display='block'}
function choose(v){sres.style.display='none';sq.blur();sq.value=v.name;pick(v)}
sq.addEventListener('input',drawRes);sq.addEventListener('focus',drawRes);
sres.addEventListener('click',e=>{const d=e.target.closest('.ri');if(!d||!d.dataset.id)return;choose(V.find(x=>x.id===d.dataset.id))});
sq.addEventListener('keydown',e=>{if(e.key==='Enter'){const r=match(sq.value.trim().toLowerCase());if(r[0])choose(r[0])}});
document.addEventListener('click',e=>{if(!e.target.closest('#srch'))sres.style.display='none'});
const dv=q.get('v');if(dv){const t=V.find(x=>x.id===dv);if(t)setTimeout(()=>pick(t),300)}
</script></body></html>
