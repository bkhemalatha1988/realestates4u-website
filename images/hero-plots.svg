<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#26543F"/>
      <stop offset="1" stop-color="#1B3F2E"/>
    </linearGradient>
    <linearGradient id="road" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8A3D21"/>
      <stop offset="1" stop-color="#A64B2A"/>
    </linearGradient>
  </defs>

  <rect width="1000" height="620" fill="url(#ground)"/>

  <!-- main crossroads -->
  <rect x="0" y="292" width="1000" height="36" fill="url(#road)"/>
  <rect x="452" y="0" width="36" height="620" fill="url(#road)"/>
  <g stroke="#E9C873" stroke-width="4" stroke-dasharray="18 16" opacity="0.7">
    <line x1="0" y1="310" x2="1000" y2="310"/>
    <line x1="470" y1="0" x2="470" y2="620"/>
  </g>

  <!-- plot grid, four quadrants -->
  <g stroke="#F1E9D8" stroke-width="2" opacity="0.55" fill="none">
    <!-- top-left -->
    <path d="M0 90 H452 M0 190 H452 M110 0 V292 M225 0 V292 M340 0 V292"/>
    <!-- top-right -->
    <path d="M488 90 H1000 M488 190 H1000 M565 0 V292 M680 0 V292 M795 0 V292 M900 0 V292"/>
    <!-- bottom-left -->
    <path d="M0 420 H452 M0 520 H452 M110 328 V620 M225 328 V620 M340 328 V620"/>
    <!-- bottom-right -->
    <path d="M488 420 H1000 M488 520 H1000 M565 328 V620 M680 328 V620 M795 328 V620 M900 328 V620"/>
  </g>

  <!-- plot corner pegs -->
  <g fill="#C9A227" opacity="0.85">
    <circle cx="110" cy="90" r="4"/><circle cx="225" cy="90" r="4"/><circle cx="340" cy="90" r="4"/>
    <circle cx="110" cy="190" r="4"/><circle cx="225" cy="190" r="4"/><circle cx="340" cy="190" r="4"/>
    <circle cx="565" cy="90" r="4"/><circle cx="680" cy="90" r="4"/><circle cx="795" cy="90" r="4"/><circle cx="900" cy="90" r="4"/>
    <circle cx="110" cy="520" r="4"/><circle cx="225" cy="520" r="4"/><circle cx="340" cy="520" r="4"/>
    <circle cx="565" cy="520" r="4"/><circle cx="680" cy="520" r="4"/><circle cx="795" cy="520" r="4"/><circle cx="900" cy="520" r="4"/>
  </g>

  <!-- small tree clusters marking plot boundaries / greenery -->
  <g fill="#3E7A5C" opacity="0.9">
    <circle cx="40" cy="40" r="14"/><circle cx="58" cy="48" r="10"/>
    <circle cx="940" cy="45" r="12"/><circle cx="958" cy="55" r="9"/>
    <circle cx="35" cy="580" r="13"/><circle cx="55" cy="588" r="9"/>
    <circle cx="945" cy="575" r="14"/><circle cx="965" cy="585" r="10"/>
    <circle cx="500" cy="45" r="10"/>
    <circle cx="500" cy="575" r="10"/>
  </g>

  <!-- a couple of small building/plot markers -->
  <g fill="#F1E9D8" opacity="0.45">
    <rect x="150" y="120" width="40" height="30" rx="2"/>
    <rect x="720" y="130" width="46" height="32" rx="2"/>
    <rect x="620" y="440" width="42" height="30" rx="2"/>
  </g>
</svg>
